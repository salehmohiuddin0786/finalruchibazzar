<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ruchi Bazaar - Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 36px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
    .logo-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: #fffbeb;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.15);
    }
    .logo-container img {
      width: 56px;
      height: 56px;
      object-fit: contain;
    }
    .icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      color: #d97706;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #d97706;
      color: #ffffff;
      font-weight: 600;
      font-size: 15px;
      padding: 14px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.3);
      transition: background 0.2s;
    }
    .btn:active {
      background: #b45309;
    }
    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <img src="Logo.png" alt="Ruchi Bazaar" onerror="this.style.display='none'">
    </div>
    <h1>No Internet Connection</h1>
    <p>Please check your cellular or Wi-Fi network and tap below to retry connecting to Ruchi Bazaar.</p>
    <button class="btn" onclick="retryConnection()">Retry Connection</button>
    <div class="hint">App will resume automatically once connection is restored.</div>
  </div>

  <script>
    function retryConnection() {
      if (navigator.onLine) {
        window.location.href = "https://ruchibazaar.in/";
      } else {
        window.location.reload();
      }
    }
    window.addEventListener("online", function() {
      window.location.href = "https://ruchibazaar.in/";
    });
  </script>
</body>
</html>
